<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>내 수업</title>
    <link
      rel="stylesheet"
      href="member-lessons.css?v=20260917-day-selection"
    />
  </head>

  <body class="member-page">
    <main class="member-app">
      <!-- 상단 -->
      <header class="member-header">
        <div class="member-brand">
          <div class="member-brand-mark">
            <i data-lucide="waves"></i>
          </div>

          <div class="member-brand-text">
            <strong>수영관리</strong>
            <span>LEE Swimming Management</span>
          </div>
        </div>

        <button
          type="button"
          class="member-notification-button"
          aria-label="알림"
        >
          <i data-lucide="bell"></i>
        </button>
      </header>

      <!-- 제목 -->
      <section class="lesson-page-heading">
        <div>
          <p class="member-kicker">My Lessons</p>

          <h1>내 수업</h1>

          <p>앞으로 2주 일정과 지난 수업 내용을 확인하세요.</p>
        </div>

        <div class="member-profile-mini">
          <div class="member-avatar">
            <i data-lucide="user-round"></i>
          </div>

          <span> 일반회원 </span>
        </div>
      </section>

      <!-- 요약 -->
      <section class="lesson-summary-grid">
        <article class="lesson-summary-card">
          <div class="lesson-summary-icon">
            <i data-lucide="calendar-days"></i>
          </div>

          <div>
            <span> 다음 수업 </span>

            <strong id="nextLessonDate"> 9월 15일 (화) </strong>

            <small id="nextLessonTime"> 오후 7:00 </small>
          </div>
        </article>

        <article class="lesson-summary-card">
          <div class="lesson-summary-icon">
            <i data-lucide="chart-no-axes-column-increasing"></i>
          </div>

          <div>
            <span> 수업 진행 </span>

            <strong id="lessonProgress"> 4 / 8회 </strong>

            <small id="remainingLessons"> 4회 남음 </small>
          </div>
        </article>
      </section>

      <!-- 진행 바 -->
      <section class="member-card lesson-progress-card">
        <div class="lesson-progress-header">
          <div>
            <span> 개인레슨 진행률 </span>

            <strong> 50% </strong>
          </div>

          <small> 총 8회 중 4회 진행 </small>
        </div>

        <div class="lesson-progress-track">
          <div class="lesson-progress-fill" style="width: 50%"></div>
        </div>
      </section>

      <!-- 2주 수업 달력 -->
      <section class="member-card">
        <div class="member-card-header">
          <div class="member-card-title">
            <i data-lucide="calendar-check"></i>

            <h2>2주 수업 일정</h2>
          </div>

          <div class="lesson-calendar-navigation">
            <button
              type="button"
              id="calendarPreviousButton"
              class="lesson-calendar-nav-button"
              aria-label="이전 주"
              title="이전 주"
              disabled
            >
              <i data-lucide="chevron-left"></i>
            </button>

            <button
              type="button"
              id="calendarTodayButton"
              class="lesson-calendar-today-button"
            >
              오늘
            </button>

            <span id="twoWeekRange" class="lesson-calendar-range"></span>

            <button
              type="button"
              id="calendarNextButton"
              class="lesson-calendar-nav-button"
              aria-label="다음 주"
              title="다음 주"
            >
              <i data-lucide="chevron-right"></i>
            </button>
          </div>
        </div>

        <div class="lesson-calendar-weekdays" aria-hidden="true">
          <span class="sunday">일</span>
          <span>월</span>
          <span>화</span>
          <span>수</span>
          <span>목</span>
          <span>금</span>
          <span class="saturday">토</span>
        </div>

        <div id="twoWeekCalendar" class="lesson-calendar-grid">
          <p class="member-empty">수업 일정을 불러오는 중입니다.</p>
        </div>

        <section class="member-calendar-detail" aria-live="polite">
          <div class="member-calendar-detail-header">
            <strong id="selectedCalendarDate">선택한 날짜</strong>
            <span id="selectedCalendarCount">0건</span>
          </div>

          <div id="selectedCalendarDetail">
            <p class="member-empty">날짜를 선택해주세요.</p>
          </div>
        </section>
      </section>

      <!-- 최근 수업 -->
      <section class="member-card">
        <div class="member-card-header">
          <div class="member-card-title">
            <i data-lucide="notebook-text"></i>

            <h2>최근 완료한 수업</h2>
          </div>

          <button
            type="button"
            class="lesson-view-all-button"
            data-lesson-modal-open="completed"
          >
            전체보기
          </button>
        </div>

        <div class="lesson-history-list">
          <p class="member-empty">완료한 수업을 불러오는 중입니다.</p>
        </div>
      </section>

      <div
        id="lessonListModal"
        class="lesson-list-modal-overlay"
        aria-hidden="true"
      >
        <div class="lesson-list-modal" role="dialog" aria-modal="true">
          <div class="lesson-list-modal-header">
            <div>
              <span id="lessonListModalKicker">Lessons</span>

              <h2 id="lessonListModalTitle">전체 수업</h2>
            </div>

            <button
              type="button"
              id="lessonListModalClose"
              class="lesson-list-modal-close"
              aria-label="닫기"
            >
              ×
            </button>
          </div>

          <div id="lessonListModalBody" class="lesson-list-modal-body"></div>
        </div>
      </div>
    </main>

    <!-- 하단 메뉴 -->
    <nav class="member-bottom-nav">
      <a href="member-home.html" class="member-nav-item">
        <span class="member-nav-icon">
          <i data-lucide="house"></i>
        </span>

        <span> 홈 </span>
      </a>

      <a href="member-lessons.html" class="member-nav-item active">
        <span class="member-nav-icon">
          <i data-lucide="calendar-days"></i>
        </span>

        <span> 내 수업 </span>
      </a>

      <a href="member-profile.html" class="member-nav-item">
        <span class="member-nav-icon">
          <i data-lucide="user-round"></i>
        </span>

        <span> 내 정보 </span>
      </a>
    </nav>

    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="supabase.js?v=20260911"></script>
    <script src="member-shared.js?v=20260917-holiday-correction"></script>
    <script src="member-lessons.js?v=20260917-day-selection"></script>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        if (window.lucide) {
          lucide.createIcons();
        }
      });
    </script>
  </body>
</html>
