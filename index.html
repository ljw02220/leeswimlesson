<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>로그인</title>

    <link rel="stylesheet" href="login.css" />
  </head>

  <body>
    <main class="login-page">
      <section class="login-card">
        <!-- ==================================================
          로그인
        ================================================== -->
        <div id="loginView">
          <div class="login-heading">
            <span class="login-kicker"> LEE Swimming Management </span>

            <h1>로그인</h1>

            <p>수업 정보를 확인하려면 로그인해주세요.</p>
          </div>

          <form id="loginForm">
            <!-- 아이디 / 전화번호 -->
            <div class="form-group">
              <label for="loginId"> 아이디 또는 전화번호 </label>

              <input
                type="text"
                id="loginId"
                name="loginId"
                autocomplete="username"
                placeholder="아이디 또는 전화번호"
                required
              />
            </div>

            <!-- 비밀번호 -->
            <div class="form-group">
              <label for="loginPassword"> 비밀번호 </label>

              <div class="password-field">
                <input
                  type="password"
                  id="loginPassword"
                  name="loginPassword"
                  autocomplete="current-password"
                  placeholder="비밀번호를 입력하세요"
                  required
                />

                <button
                  type="button"
                  id="togglePassword"
                  class="password-toggle"
                  aria-label="비밀번호 보기"
                >
                  보기
                </button>
              </div>
            </div>

            <!-- 로그인 유지 -->
            <label class="remember-row">
              <input type="checkbox" id="rememberLogin" />

              <span> 로그인 유지 </span>
            </label>

            <!-- 로그인 오류 -->
            <p id="loginError" class="login-error" aria-live="polite"></p>

            <!-- 로그인 버튼 -->
            <button type="submit" class="login-button">로그인</button>
          </form>

          <!-- 회원가입 이동 -->
          <div class="auth-switch">
            <span> 처음 이용하시나요? </span>

            <button
              type="button"
              id="showSignupButton"
              class="auth-switch-button"
            >
              회원가입
            </button>
          </div>
        </div>

        <!-- ==================================================
          회원가입
        ================================================== -->
        <div id="signupView" class="auth-view-hidden">
          <div class="login-heading">
            <span class="login-kicker"> LEE Swimming Management </span>

            <h1>회원가입</h1>

            <p>가입 신청 후 관리자 승인이 필요합니다.</p>
          </div>

          <form id="signupForm">
            <!-- 이름 -->
            <div class="form-group">
              <label for="signupName"> 이름 </label>

              <input
                type="text"
                id="signupName"
                name="signupName"
                autocomplete="name"
                placeholder="이름을 입력하세요"
                required
              />
            </div>

            <!-- 전화번호 -->
            <div class="form-group">
              <label for="signupPhone"> 전화번호 </label>

              <input
                type="tel"
                id="signupPhone"
                name="signupPhone"
                autocomplete="tel"
                inputmode="numeric"
                maxlength="13"
                placeholder="010-1234-5678"
                required
              />
            </div>

            <!-- 비밀번호 -->
            <div class="form-group">
              <label for="signupPassword"> 비밀번호 </label>

              <div class="password-field">
                <input
                  type="password"
                  id="signupPassword"
                  name="signupPassword"
                  autocomplete="new-password"
                  placeholder="비밀번호를 입력하세요"
                  minlength="6"
                  required
                />

                <button
                  type="button"
                  id="toggleSignupPassword"
                  class="password-toggle"
                  aria-label="비밀번호 보기"
                >
                  보기
                </button>
              </div>
            </div>

            <!-- 비밀번호 확인 -->
            <div class="form-group">
              <label for="signupPasswordConfirm"> 비밀번호 확인 </label>

              <div class="password-field">
                <input
                  type="password"
                  id="signupPasswordConfirm"
                  name="signupPasswordConfirm"
                  autocomplete="new-password"
                  placeholder="비밀번호를 다시 입력하세요"
                  minlength="6"
                  required
                />

                <button
                  type="button"
                  id="toggleSignupPasswordConfirm"
                  class="password-toggle"
                  aria-label="비밀번호 보기"
                >
                  보기
                </button>
              </div>
            </div>

            <!-- 회원가입 오류 -->
            <p id="signupError" class="login-error" aria-live="polite"></p>

            <!-- 회원가입 성공 -->
            <p id="signupSuccess" class="signup-success" aria-live="polite"></p>

            <!-- 회원가입 버튼 -->
            <button type="submit" class="login-button">가입 신청</button>
          </form>

          <!-- 로그인으로 돌아가기 -->
          <div class="auth-switch">
            <span> 이미 가입하셨나요? </span>

            <button
              type="button"
              id="showLoginButton"
              class="auth-switch-button"
            >
              로그인
            </button>
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="supabase.js?v=20260911"></script>
    <script src="login.js?v=20260913-member-email"></script>
  </body>
</html>
