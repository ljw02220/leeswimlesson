<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>수업관리</title>

    <link rel="stylesheet" href="common.css" />
  </head>

  <body>
    <!-- 상단 네비게이션 -->
    <nav class="top-nav">
      <a href="home.html" class="nav-link">홈</a>
      <a href="lessons.html" class="nav-link active">수업관리</a>
      <a href="members.html" class="nav-link">회원관리</a>
      <a href="finance.html" class="nav-link">재무관리</a>

      <button id="logoutButton" class="logout-button" type="button">
        로그아웃
      </button>
    </nav>

    <!-- 수업관리 -->
    <main class="dashboard">
      <section class="schedule-panel">
        <div class="wrapper">
          <!-- 달력 상단 -->
          <header class="calendar-header">
            <div class="nav">
              <button type="button" id="prev" aria-label="이전 달">‹</button>

              <p class="current-date"></p>

              <button type="button" id="next" aria-label="다음 달">›</button>
            </div>
          </header>

          <!-- 달력 -->
          <div class="calendar">
            <ul class="weeks">
              <li>일</li>
              <li>월</li>
              <li>화</li>
              <li>수</li>
              <li>목</li>
              <li>금</li>
              <li>토</li>
            </ul>

            <ul class="days"></ul>
          </div>

          <!-- 수업 종류 안내 -->
          <div class="schedule-legend">
            <div class="legend-item">
              <span class="legend-color personal"></span>
              <span>개인레슨</span>
            </div>

            <div class="legend-item">
              <span class="legend-color group"></span>
              <span>단체강습</span>
            </div>

            <div class="legend-item">
              <span class="legend-color makeup"></span>
              <span>보강</span>
            </div>

            <div class="legend-item">
              <span class="legend-color cancelled"></span>
              <span>취소</span>
            </div>
          </div>

          <!-- 오늘 수업 -->
          <section class="today-lessons">
            <div class="today-lessons-header">
              <div class="today-title-area">
                <h2>오늘 수업</h2>

                <span id="today-date"></span>
                <span id="today-count">0건</span>
              </div>

              <button type="button" class="add-lesson-btn" id="add-lesson-btn">
                <span>＋</span>
                수업 추가
              </button>
            </div>

            <div class="today-lesson-list" id="today-lesson-list">
              <p class="today-empty">오늘 예정된 수업이 없습니다.</p>
            </div>
          </section>
        </div>
      </section>
    </main>

    <!-- 수업 추가 팝업 -->
    <div class="lesson-modal" id="lesson-modal" aria-hidden="true">
      <div
        class="lesson-modal-box"
        role="dialog"
        aria-modal="true"
        aria-labelledby="lesson-modal-title"
      >
        <div class="lesson-modal-header">
          <h3 id="lesson-modal-title">수업 추가</h3>

          <button
            type="button"
            id="close-lesson-modal"
            aria-label="수업 추가 팝업 닫기"
          >
            ×
          </button>
        </div>

        <div class="lesson-form">
          <label for="lesson-type"> 수업 종류 </label>

          <select id="lesson-type">
            <option value="personal">개인레슨</option>
            <option value="group">단체강습</option>
            <option value="makeup">보강</option>
          </select>

          <label for="lesson-date"> 날짜 </label>

          <input type="date" id="lesson-date" />

          <label for="lesson-time"> 시간 </label>

          <input type="time" id="lesson-time" />

          <label for="lesson-title"> 회원명 / 수업명 </label>

          <input
            type="text"
            id="lesson-title"
            placeholder="예: 김혜민 또는 초급반"
          />

          <button type="button" id="save-lesson-btn">수업 저장</button>
        </div>
      </div>
    </div>

    <!-- 수업 상세 팝업 -->
    <div class="lesson-modal" id="lesson-detail-modal" aria-hidden="true">
      <div
        class="lesson-modal-box"
        role="dialog"
        aria-modal="true"
        aria-labelledby="lesson-detail-title"
      >
        <div class="lesson-modal-header">
          <h3 id="lesson-detail-title">수업 상세</h3>

          <button
            type="button"
            id="close-detail-modal"
            aria-label="수업 상세 팝업 닫기"
          >
            ×
          </button>
        </div>

        <div class="lesson-detail">
          <div class="detail-row">
            <span class="detail-label"> 날짜 </span>

            <strong id="detail-date"></strong>
          </div>

          <div class="detail-row">
            <span class="detail-label"> 시간 </span>

            <strong id="detail-time"></strong>
          </div>

          <div class="detail-row">
            <span class="detail-label"> 수업 종류 </span>

            <strong id="detail-type"></strong>
          </div>

          <div class="detail-row">
            <span class="detail-label"> 회원 / 수업명 </span>

            <strong id="detail-title"></strong>
          </div>

          <div class="detail-row">
            <label class="detail-label" for="detail-status"> 진행 상태 </label>

            <select id="detail-status">
              <option value="scheduled">예정</option>
              <option value="completed">완료</option>
              <option value="cancelled">취소</option>
            </select>
          </div>
        </div>

        <div class="detail-actions">
          <button
            type="button"
            id="confirm-detail-btn"
            class="confirm-detail-btn"
          >
            확인
          </button>

          <button
            type="button"
            id="delete-lesson-btn"
            class="delete-lesson-btn"
            hidden
          >
            수업 삭제
          </button>
        </div>
      </div>
    </div>

    <script src="common.js"></script>
    <script src="lessons.js"></script>
  </body>
</html>
