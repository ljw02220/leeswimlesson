<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>회원 홈</title>

    <link rel="stylesheet" href="member-home.css" />
  </head>

  <body class="member-page">
    <main class="member-app">
      <!-- 상단 -->
      <header class="member-header">
        <div class="member-brand">
          <div class="member-brand-mark">
            <i data-lucide="waves"></i>
          </div>

          <div class="member-brand-text">
            <strong>수영관리</strong>
            <span>LEE Swimming Management</span>
          </div>
        </div>

        <button
          type="button"
          class="member-notification-button"
          aria-label="알림"
        >
          <i data-lucide="bell"></i>
        </button>
      </header>

      <!-- 인사 -->
      <section class="member-greeting">
        <div class="member-greeting-text">
          <p class="member-kicker"></p>

          <h1>
            안녕하세요,
            <span id="memberGreetingName"> 이정우 </span> 님
          </h1>

          <p>이번 주 수업과 결제 현황을 확인하세요.</p>
        </div>

        <div class="member-profile-mini">
          <div class="member-avatar">
            <i data-lucide="user-round"></i>
          </div>

          <span> 일반회원 </span>
        </div>
      </section>

      <!-- 요약 카드 -->
      <section class="member-summary-grid">
        <article class="member-summary-card">
          <div class="summary-icon">
            <i data-lucide="calendar-days"></i>
          </div>

          <div class="summary-content">
            <span> 다음 수업 </span>

            <strong id="nextLessonDate"> 9월 15일 (화) </strong>

            <small id="nextLessonTime"> 오후 7:00 </small>
          </div>
        </article>

        <article class="member-summary-card">
          <div class="summary-icon">
            <i data-lucide="bookmark"></i>
          </div>

          <div class="summary-content">
            <span> 남은 수업 </span>

            <strong id="remainingLessons"> 4회 </strong>

            <small id="lessonProgressText"> 총 8회 중 </small>
          </div>
        </article>

        <article class="member-summary-card">
          <div class="summary-icon">
            <i data-lucide="chart-no-axes-column-increasing"></i>
          </div>

          <div class="summary-content">
            <span> 이번 달 진행 </span>

            <strong id="monthlyLessonCount"> 3회 </strong>

            <small> 이번 달 수업 </small>
          </div>
        </article>

        <article class="member-summary-card">
          <div class="summary-icon">
            <i data-lucide="credit-card"></i>
          </div>

          <div class="summary-content">
            <span> 결제 상태 </span>

            <strong id="paymentStatus" class="payment-complete"> 완납 </strong>

            <small id="paymentDate"> 9월 11일 입금 </small>
          </div>
        </article>
      </section>

      <!-- 다가오는 수업 -->
      <section class="member-card">
        <div class="member-card-header">
          <div class="member-card-title">
            <i data-lucide="calendar-check"></i>

            <h2>다가오는 수업</h2>
          </div>

          <a href="member-lessons.html" class="member-card-link"> 전체 보기 </a>
        </div>

        <div id="upcomingLessonList" class="member-lesson-list">
          <p class="member-empty">수업 정보를 불러오는 중입니다.</p>
        </div>
      </section>

      <!-- 최근 수업 내용 -->
      <section class="member-card">
        <div class="member-card-header">
          <div class="member-card-title">
            <i data-lucide="notebook-text"></i>

            <h2>최근 수업 내용</h2>
          </div>

          <a href="member-lessons.html" class="member-card-link"> 전체 보기 </a>
        </div>

        <div class="member-feedback-list">
          <p class="member-empty">수업 내용을 불러오는 중입니다.</p>
        </div>
      </section>
    </main>

    <!-- 하단 메뉴 -->
    <nav class="member-bottom-nav">
      <a href="member-home.html" class="member-nav-item active">
        <span class="member-nav-icon">
          <i data-lucide="house"></i>
        </span>

        <span> 홈 </span>
      </a>

      <a href="member-lessons.html" class="member-nav-item">
        <span class="member-nav-icon">
          <i data-lucide="calendar-days"></i>
        </span>

        <span> 내 수업 </span>
      </a>

      <a href="member-profile.html" class="member-nav-item">
        <span class="member-nav-icon">
          <i data-lucide="user-round"></i>
        </span>

        <span> 내 정보 </span>
      </a>
    </nav>

    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="supabase.js?v=20260911"></script>
    <script src="member-shared.js?v=20260916-group-feedback"></script>
    <script src="member-home.js?v=20260916-group-feedback"></script>

    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
