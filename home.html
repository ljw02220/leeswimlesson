<!DOCTYPE html>
<html lang="ko">
  <head>
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=20261125" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=20261125" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="manifest" href="site.webmanifest?v=20261125-icons" />

    <title>홈</title>

    <link rel="stylesheet" href="common.css?v=20261104-mobile-layout" />
    <link rel="stylesheet" href="home.css?v=20261125-saved-view" />
    <link rel="stylesheet" href="workout-plan.css?v=20261125-stroke-below" />
</head>

  <body>
    <!-- 상단 네비게이션 -->
    <nav class="top-nav">
      <a href="home.html" class="nav-link active">홈</a>
      <a href="lessons.html" class="nav-link">수업관리</a>
      <a href="members.html" class="nav-link">회원관리</a>
      <a href="finance.html" class="nav-link">재무관리</a>

      <details class="admin-account">
        <summary class="admin-account-trigger">
          관리자 <span aria-hidden="true">⌄</span>
        </summary>
        <div class="admin-account-menu">
          <button id="logoutButton" class="admin-logout-button" type="button">
            로그아웃
          </button>
        </div>
      </details>
    </nav>

    <main class="management-page">
      <section class="home-heading">
        <div><p class="page-kicker">TODAY</p><h1>오늘의 관리</h1><p id="homeTodayDate" class="home-date"></p></div>
        <button type="button" id="homeRefresh" class="home-refresh">새로고침 <span aria-hidden="true">↻</span></button>
      </section>
      <p class="home-intro">오늘 수업과 확인할 일을 한눈에 살펴보세요.</p>
      <p id="homeDashboardMessage" class="home-dashboard-message" role="status" hidden></p>

      <section class="home-attention" aria-label="확인할 일">
        <a href="finance.html#paymentRequests" class="home-task"><span class="home-task-icon" aria-hidden="true">₩</span><span class="home-task-title">입금 확인</span><strong id="homePaymentCount">—</strong><small>확인 대기 <span aria-hidden="true">→</span></small></a>
        <a href="lessons.html?makeup=open" class="home-task"><span class="home-task-icon" aria-hidden="true">＋</span><span class="home-task-title">보강 신청</span><strong id="homeMakeupCount">—</strong><small>신청 · 횟수 확인 <span aria-hidden="true">→</span></small></a>
        <a href="members.html" class="home-task"><span class="home-task-icon" aria-hidden="true">♙</span><span class="home-task-title">가입 승인</span><strong id="homeSignupCount">—</strong><small>승인 대기 <span aria-hidden="true">→</span></small></a>
        <a href="#homeRecentComments" class="home-task"><span class="home-task-icon" aria-hidden="true">☷</span><span class="home-task-title">새 댓글</span><strong id="homeCommentCount">—</strong><small>수업 이야기 <span aria-hidden="true">↓</span></small></a>
      </section>

      <section class="home-workspace">
        <article class="manager-card home-schedule-card">
          <div class="card-header"><div><h2>수업 달력</h2><p id="homeScheduleSummary">일정을 불러오고 있습니다.</p></div><a href="lessons.html" class="home-more-link">수업관리 →</a></div>
          <div class="admin-calendar-navigation"><button type="button" id="homeCalendarPrev" aria-label="이전 달">‹</button><strong id="homeCalendarMonth"></strong><button type="button" id="homeCalendarNext" aria-label="다음 달">›</button><button type="button" id="homeCalendarToday">오늘</button></div>
          <div class="admin-calendar-weekdays" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
          <div id="homeCalendarDays" class="admin-calendar-days" aria-label="월간 수업 날짜"></div>
          <p class="admin-calendar-legend"><span>● 예정</span><span>● 완료</span><span>● 새 댓글</span><span class="workout-written-legend">✓ 운동량 작성</span></p>
          <div id="homeWorkoutSavedView" class="home-workout-saved-view" aria-live="polite"></div>
          <details class="home-daily-workout" id="homeDailyWorkout"><summary>운동량 작성 · 수정 <span id="homeWorkoutDate"></span><strong id="homeWorkoutStatus" class="home-workout-status" role="status">확인 중</strong></summary><form id="homeWorkoutForm" novalidate><div class="workout-editor" id="homeWorkoutEditor"></div><div class="home-note-actions"><p id="homeWorkoutMessage" role="status"></p><button type="submit" disabled>운동량 저장</button></div></form></details>
          <h3 class="admin-selected-heading"><span id="homeSelectedDate"></span><span id="todayLessonCount" class="home-count">—</span></h3>
          <div id="homeTodayLessons" class="home-list"><p class="home-empty">수업을 불러오는 중입니다.</p></div>
        </article>
        <article class="manager-card home-comments-card" id="homeRecentComments">
          <div class="card-header"><div><h2>수업 댓글</h2><p>수업을 선택하고 댓글과 답글을 함께 확인하세요.</p></div><span id="homeCommentTotal" class="home-count"></span></div>
          <label class="home-thread-label" for="homeCommentThreadSelect">수업 선택</label>
          <select id="homeCommentThreadSelect" class="home-thread-select" disabled><option>불러오는 중입니다.</option></select>
          <div id="homeCommentList" class="home-list"><p class="home-empty">댓글을 불러오는 중입니다.</p></div>
        </article>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js?v=20260922-login-persistence"></script>
    <script src="common.js?v=20261104-admin-nav"></script>
    <script src="config.js"></script>
    <script src="lesson-moves.js?v=20261125"></script>
    <script src="lessons.js?v=20261125-moves"></script>
    <script src="lesson-threads.js?v=20261124-replies"></script>
<script src="workout-plan.js?v=20261125-group-phase"></script>
    <script src="home.js?v=20261125-separated-workout"></script>
    <script src="notifications.js?v=20261125-push-sync"></script>
  <script src="admin-daily-workout.js?v=20261125-saved-view"></script>
<script src="app-refresh.js?v=20261125-wrap-fix"></script>
</body>
</html>
