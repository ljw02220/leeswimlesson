<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>홈</title>

    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="home.css" />
  </head>

  <body>
    <!-- 상단 네비게이션 -->
    <nav class="top-nav">
      <a href="home.html" class="nav-link active">홈</a>
      <a href="lessons.html" class="nav-link">수업관리</a>
      <a href="members.html" class="nav-link">회원관리</a>
      <a href="finance.html" class="nav-link">재무관리</a>

      <button id="logoutButton" class="logout-button" type="button">
        로그아웃
      </button>
    </nav>

    <main class="management-page">
      <!-- 페이지 제목 -->
      <section class="page-heading">
        <div>
          <span class="page-kicker">Dashboard</span>
          <h1>홈</h1>
        </div>
      </section>

      <!-- 인사말 -->
      <span class="salutation"> 관리자님 안녕하세요! </span>

      <!-- 요약 카드 -->
      <section class="metric-grid home-metric-grid">
        <a href="lessons.html" class="metric-card metric-link">
          <span>오늘 수업</span>
          <strong id="todayLessonCount">0건</strong>
          <small>오늘 예정된 수업</small>
        </a>

        <a href="members.html" class="metric-card metric-link">
          <span>전체 회원</span>
          <strong id="totalMemberCount">0명</strong>
          <small>등록된 개인레슨 회원</small>
        </a>

        <a href="members.html" class="metric-card metric-link">
          <span>재등록 예정</span>
          <strong id="renewalMemberCount">0명</strong>
          <small>잔여 수업 1회 이하</small>
        </a>

        <a href="finance.html" class="metric-card metric-link income">
          <span>이번 달 수입</span>
          <strong id="monthlyIncome">0원</strong>
          <small>이번 달 등록된 수입</small>
        </a>
      </section>

      <!-- 대시보드 본문 -->
      <section class="home-content-grid">
        <!-- 오늘 수업 -->
        <article class="manager-card">
          <div class="card-header">
            <div>
              <h2>오늘 수업</h2>
              <p>오늘 예정된 수업을 확인할 수 있습니다.</p>
            </div>

            <a href="lessons.html" class="home-more-link"> 수업관리 </a>
          </div>

          <div id="homeTodayLessons" class="home-list">
            <div class="home-empty">오늘 예정된 수업이 없습니다.</div>
          </div>
        </article>

        <!-- 2주 수업 스케줄 -->
        <article class="manager-card">
          <div class="card-header">
            <div>
              <h2>2주 수업 스케줄</h2>
              <p>오늘부터 2주간 예정된 수업을 확인할 수 있습니다.</p>
            </div>

            <a href="lessons.html" class="home-more-link"> 수업관리 </a>
          </div>

          <div id="homeTwoWeekSchedule" class="home-list">
            <div class="home-empty">예정된 수업이 없습니다.</div>
          </div>
        </article>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js?v=20260911"></script>
    <script src="common.js?v=20260911"></script>
    <script src="home.js?v=20260911"></script>
  </body>
</html>
