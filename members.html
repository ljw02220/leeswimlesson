<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="members.css" />

    <title>회원관리</title>
  </head>

  <body class="members-page">
    <nav class="top-nav">
      <a href="home.html" class="nav-link">홈</a>
      <a href="lessons.html" class="nav-link">수업관리</a>
      <a href="members.html" class="nav-link active">회원관리</a>
      <a href="finance.html" class="nav-link">재무관리</a>

      <button id="logoutButton" class="logout-button" type="button">
        로그아웃
      </button>
    </nav>

    <main class="management-page">
      <!-- 페이지 제목 -->
      <section class="page-heading">
        <div>
          <span class="page-kicker">Members</span>
          <h1>회원관리</h1>
        </div>

        <button type="button" class="primary-action" id="addMemberButton">
          회원 추가
        </button>
      </section>

      <!-- 상단 통계 -->
      <section class="metric-grid">
        <article class="metric-card">
          <span>전체 회원</span>
          <strong>0명</strong>
          <small>등록된 개인레슨 회원</small>
        </article>

        <article class="metric-card">
          <span>수강중</span>
          <strong>0명</strong>
          <small>현재 수업 진행중</small>
        </article>

        <article class="metric-card">
          <span>재등록 예정</span>
          <strong>0명</strong>
          <small>잔여 수업 2회 이하</small>
        </article>

        <article class="metric-card">
          <span>미납 회원</span>
          <strong>0명</strong>
          <small>미납 내역 없음</small>
        </article>
      </section>

      <!-- 회원 목록 / 개인레슨 일정 -->
      <section class="content-grid">
        <div class="manager-card member-list-card">
          <div class="card-header">
            <div>
              <h2>회원 목록</h2>
            </div>

            <div class="filter-group">
              <button
                type="button"
                class="filter-chip active"
                data-filter="전체"
              >
                전체
              </button>

              <button type="button" class="filter-chip" data-filter="수강중">
                수강중
              </button>

              <button
                type="button"
                class="filter-chip"
                data-filter="재등록 예정"
              >
                재등록 예정
              </button>

              <button type="button" class="filter-chip" data-filter="미납">
                미납
              </button>
            </div>
          </div>

          <div class="table-wrap">
            <table class="data-table">
              <thead>
                <tr>
                  <th>회원명</th>
                  <th>요일&시간</th>
                  <th>예정</th>
                  <th>잔여</th>
                  <th>수업 형태</th>
                  <th>보고</th>
                </tr>
              </thead>

              <tbody id="memberTableBody"></tbody>
            </table>
          </div>
        </div>

        <aside class="manager-card side-card">
          <div class="card-header compact">
            <h2>개인레슨 일정</h2>
          </div>

          <div class="lesson-period-list"></div>
        </aside>
      </section>
    </main>

    <!-- 회원 추가 / 수정 모달 -->
    <div id="memberModal" class="member-modal-overlay">
      <div class="member-modal">
        <div class="member-modal-header">
          <div>
            <span class="modal-kicker">Personal Lesson</span>
            <h2 id="memberModalTitle">회원 추가</h2>
          </div>

          <button
            type="button"
            id="closeMemberModal"
            class="modal-close-button"
            aria-label="닫기"
          >
            ×
          </button>
        </div>

        <form id="memberForm">
          <div class="member-form-grid">
            <!-- 회원 기본정보 -->
            <div class="form-group">
              <label for="memberName">회원명</label>
              <input
                type="text"
                id="memberName"
                placeholder="회원 이름"
                required
              />
            </div>

            <div class="form-group">
              <label for="memberPhone">전화번호</label>
              <input
                type="tel"
                id="memberPhone"
                placeholder="010-1234-5678"
                maxlength="13"
              />
            </div>

            <!-- 수업 정보 -->
            <div class="form-group">
              <label for="lessonFormat">수업 형태</label>
              <select id="lessonFormat">
                <option value="1:1">1:1</option>
                <option value="1:2">1:2</option>
                <option value="1:3">1:3</option>
                <option value="1:4">1:4</option>
                <option value="1:5">1:5</option>
              </select>
            </div>

            <div class="form-group">
              <label for="memberTime">수업 시간</label>
              <input type="time" id="memberTime" />
            </div>

            <div class="form-group">
              <label for="lessonStartDate">수업 시작일</label>
              <input type="date" id="lessonStartDate" />
            </div>

            <div class="form-group full-width">
              <label>수업 요일</label>

              <div class="weekday-group">
                <label>
                  <input type="checkbox" name="lessonDay" value="화" />
                  화
                </label>

                <label>
                  <input type="checkbox" name="lessonDay" value="수" />
                  수
                </label>

                <label>
                  <input type="checkbox" name="lessonDay" value="목" />
                  목
                </label>

                <label>
                  <input type="checkbox" name="lessonDay" value="금" />
                  금
                </label>

                <label>
                  <input type="checkbox" name="lessonDay" value="토" />
                  토
                </label>

                <label>
                  <input type="checkbox" name="lessonDay" value="일" />
                  일
                </label>
              </div>
            </div>

            <!-- 수업 횟수 -->
            <div class="form-group">
              <label for="totalLessons">등록 횟수</label>
              <select id="totalLessons">
                <option value="4">4회</option>
                <option value="8">8회</option>
                <option value="12">12회</option>
                <option value="16">16회</option>
              </select>
            </div>

            <div class="form-group">
              <label for="usedLessons">진행 횟수</label>
              <input type="number" id="usedLessons" min="0" value="0" />
            </div>

            <div class="form-group">
              <label>잔여 횟수</label>
              <div id="remainingLessonPreview" class="remaining-preview">
                8회
              </div>
            </div>

            <!-- 결제 정보 -->
            <div class="form-group">
              <label for="paymentAmount">결제 금액</label>
              <input
                type="text"
                id="paymentAmount"
                inputmode="numeric"
                autocomplete="off"
                placeholder="예: 300,000"
              />
            </div>

            <div class="form-group">
              <label for="paymentDate">결제일</label>
              <input type="date" id="paymentDate" />
            </div>

            <div class="form-group">
              <label for="paymentStatus">결제 상태</label>
              <select id="paymentStatus">
                <option value="완납">완납</option>
                <option value="미납">미납</option>
                <option value="확인필요">확인필요</option>
              </select>
            </div>

            <div class="form-group">
              <label for="personalReportedAt">보고 완료일</label>
              <input type="date" id="personalReportedAt" />
            </div>

            <!-- 회원 상태 -->
            <div class="form-group">
              <label for="memberStatus">회원 상태</label>
              <select id="memberStatus">
                <option value="수강중">수강중</option>
                <option value="휴회">휴회</option>
                <option value="종료">종료</option>
              </select>
            </div>

            <div class="form-group">
              <label for="lastLessonDate">최근 수업일</label>
              <input type="date" id="lastLessonDate" />
            </div>

            <!-- 메모 -->
            <div class="form-group full-width">
              <label for="memberMemo">메모</label>
              <textarea
                id="memberMemo"
                rows="4"
                placeholder="회원 관련 메모를 입력하세요."
              ></textarea>
            </div>
          </div>

          <!-- 하단 버튼 -->
          <div class="member-modal-actions">
            <button type="button" id="deleteMemberButton" class="danger-button">
              회원 삭제
            </button>

            <div class="modal-action-right">
              <button
                type="button"
                id="cancelMemberButton"
                class="secondary-button"
              >
                취소
              </button>

              <button type="submit" class="primary-action">저장</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="supabase.js?v=20260911"></script>
    <script src="common.js?v=20260911"></script>
    <script src="members.js?v=20260912-edit-retry"></script>
  </body>
</html>
