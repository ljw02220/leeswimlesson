<!DOCTYPE html>
<html lang="ko">
  <head>
    <link rel="manifest" href="site.webmanifest?v=20261125-icons" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=20261125" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png?v=20261125" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>내 정보</title>

    <link rel="stylesheet" href="member-profile.css?v=20260913" />
    <link rel="stylesheet" href="member-portal.css?v=20261124-profile-icon" />
  </head>

  <body class="member-page">
    <main class="member-app">
      <!-- 상단 -->
      <header class="member-header">
        <div class="member-brand">
          <div class="member-brand-mark">
            <i data-lucide="waves"></i>
          </div>

          <div class="member-brand-text">
            <strong> 수영관리 </strong>

            <span> LEE Swimming Management </span>
          </div>
        </div>

        <button
          type="button"
          class="member-notification-button"
          aria-label="알림"
        >
          <i data-lucide="bell"></i>
        </button>
      </header>

      <!-- 페이지 제목 -->
      <section class="profile-page-heading">
        <div>
          <p class="member-kicker">My Profile</p>

          <h1>내 정보</h1>

          <p>회원 정보와 수강 현황을 확인하세요.</p>
        </div>

        <a href="member-home.html" class="member-profile-mini member-profile-shortcut" aria-label="홈">
          <div class="member-avatar"><i data-lucide="house"></i></div>
          <span>홈</span>
        </a>
      </section>

      <!-- 회원 기본정보 -->
      <section class="profile-card">
        <div class="profile-card-header">
          <div class="profile-card-title">
            <i data-lucide="user-round"></i>

            <h2>회원 정보</h2>
          </div>
        </div>

        <div class="profile-info-list">
          <div class="profile-info-row">
            <span> 이름 </span>

            <strong id="profileName"> 이정우 </strong>
          </div>

          <div class="profile-info-row">
            <span> 전화번호 </span>

            <strong id="profilePhone"> 010-1234-5678 </strong>
          </div>

          <div class="profile-info-row">
            <span> 회원 상태 </span>

            <strong id="profileStatus" class="profile-status active">
              수강중
            </strong>
          </div>
        </div>

        <button
          type="button"
          class="profile-outline-button"
          id="profileEditButton"
        >
          <i data-lucide="pencil"></i>

          회원 정보 수정
        </button>
      </section>

      <!-- 수강 정보 -->
      <section class="profile-card">
        <div class="profile-card-header">
          <div class="profile-card-title">
            <i data-lucide="calendar-days"></i>

            <h2>수강 정보</h2>
          </div>
        </div>

        <div class="profile-info-list">
          <div class="profile-info-row">
            <span> 수업 형태 </span>

            <strong id="profileLessonType"> 개인레슨 </strong>
          </div>

          <div class="profile-info-row">
            <span> 수업 요일 </span>

            <strong id="profileLessonDays"> 화요일 </strong>
          </div>

          <div class="profile-info-row">
            <span> 수업 시간 </span>

            <strong id="profileLessonTime"> 오후 7:00 </strong>
          </div>

          <div class="profile-info-row">
            <span> 등록 횟수 </span>

            <strong id="profileTotalLessons"> 8회 </strong>
          </div>

          <div class="profile-info-row">
            <span> 진행 횟수 </span>

            <strong id="profileUsedLessons"> 4회 </strong>
          </div>

          <div class="profile-info-row">
            <span> 남은 횟수 </span>

            <strong id="profileRemainingLessons" class="profile-highlight">
              4회
            </strong>
          </div>
        </div>
      </section>

      <!-- 결제 현황 -->
      <section class="profile-card">
        <div class="profile-card-header">
          <div class="profile-card-title">
            <i data-lucide="wallet-cards"></i>

            <h2>결제 현황</h2>
          </div>

          <span id="profilePaymentStatus" class="payment-status complete">
            완납
          </span>
        </div>

        <div class="profile-info-list">
          <div class="profile-info-row">
            <span> 수강료 </span>

            <strong id="profilePaymentAmount"> 150,000원 </strong>
          </div>

          <div class="profile-info-row">
            <span> 최근 결제일 </span>

            <strong id="profilePaymentDate"> 2026.09.11 </strong>
          </div>
        </div>
      </section>

      <section class="profile-footer-actions">
        <button type="button" class="profile-logout-button" id="logoutButton">
          <i data-lucide="log-out"></i>

          로그아웃
        </button>
      </section>
    </main>

    <!-- 하단 메뉴 -->

    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="supabase.js?v=20260911"></script>
    <script src="lesson-moves.js?v=20261125"></script>
    <script src="member-shared.js?v=20261125-moves"></script>
    <script src="member-profile.js?v=20261124-profile-summary"></script>
    <script src="notifications.js?v=20261125-guide"></script>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        if (window.lucide) {
          lucide.createIcons();
        }
      });
    </script>
  <script src="app-refresh.js?v=20261125-wrap-fix"></script>
</body>
</html>
